<!DOCTYPE html>
<html>

<head>
    <title>BMI and Calorie Calculator</title>
    <meta charset="UTF-8">
    <style>
        #personImage {
            display: block;
            width: 180px;
            margin: 1rem auto;
            transform-origin: left center;
            transition: transform 900ms ease-in-out;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <h1>BMI and Calorie Calculator</h1>
        <form>
            <p>
                <label for="weight">Enter your weight(kg):</label>
                <input type="number" id="weight">
            </p>

            <p>
                <label for="height">Enter your height(cm):</label>
                <input type="number" id="height">
            </p>

            <p>
                <label for="age">Enter your age:</label>
                <input type="number" id="age">
            </p>

            <p>
                <label for="gender">Select your gender:</label>
                <select id="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </p>

            <p><button type="button" onclick="calculateBMI()">Calculate BMI</button></p>
            <p><button type="button" onclick="mealPlan()">Generate Meal Plan</button></p>
           
            <img id="personImage" src="img/Person.png" alt="Person representing BMI">
            
            <p id="bmiHeading"></p>
            <p id="bmiResult"></p>
            <p id="calorieResult"></p>
            <p id="mealPlanResult"></p>




        </form>
        <script src="js/script.js"></script>

</body>

</html>
